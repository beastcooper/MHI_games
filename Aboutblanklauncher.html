<!DOCTYPE html>
<html>
<body style="margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#111;">
<button onclick="launch()"
style="font-size:50px;padding:40px 80px;border:none;border-radius:20px;background:orange;color:white;">
🚀 Launch Tacopanda
</button>

<script>
async function launch() {

    const response = await fetch(
        "https://raw.githubusercontent.com/beastcooper/Tacopanda_Arcade/master/Tacopanda.fun_aboutblank"
    );

    const html = await response.text();

    const win = window.open("about:blank", "_blank");

    win.document.open();
    win.document.write(html);
    win.document.close();
}
</script>

</body>
</html>
