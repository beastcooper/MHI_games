<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Helper Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&amp;family=Exo+2:wght@300;400;700&amp;display=swap" rel="stylesheet">
  <style>

    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }

    :root {

      --bg-color: #020510; --text-color: #e0e8ff; --accent-color: #00d4ff;

      --glow-color: #7b2fff; --glass-bg: rgba(10, 20, 50, 0.35);

      --glass-border: rgba(120, 200, 255, 0.18);

      --glass-shadow: 0 8px 32px rgba(0, 180, 255, 0.1), 0 2px 8px rgba(0,0,0,0.5);

    }

    * { box-sizing: border-box; }

    body { background: var(--bg-color); font-family: 'Orbitron', sans-serif; color: #e8f7ff; }

    .nebula-bg {

      position: fixed; inset: 0; z-index: 0; pointer-events: none;

      background:

        radial-gradient(ellipse at 15% 20%, rgba(123,47,255,0.18) 0%, transparent 50%),

        radial-gradient(ellipse at 85% 75%, rgba(0,212,255,0.15) 0%, transparent 50%),

        radial-gradient(ellipse at 50% 50%, rgba(0,30,80,0.8) 0%, #020510 70%);

    }

    .stars {

      position: fixed; inset: 0; z-index: 0; pointer-events: none;

      background-image:

        radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.7) 0%, transparent 100%),

        radial-gradient(1px 1px at 25% 40%, rgba(255,255,255,0.5) 0%, transparent 100%),

        radial-gradient(1.5px 1.5px at 40% 10%, rgba(255,255,255,0.6) 0%, transparent 100%),

        radial-gradient(1px 1px at 55% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),

        radial-gradient(1px 1px at 70% 25%, rgba(255,255,255,0.7) 0%, transparent 100%),

        radial-gradient(1.5px 1.5px at 80% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),

        radial-gradient(1px 1px at 90% 45%, rgba(255,255,255,0.6) 0%, transparent 100%),

        radial-gradient(1px 1px at 35% 75%, rgba(255,255,255,0.4) 0%, transparent 100%),

        radial-gradient(1px 1px at 60% 90%, rgba(255,255,255,0.5) 0%, transparent 100%),

        radial-gradient(1.5px 1.5px at 5% 55%, rgba(255,255,255,0.6) 0%, transparent 100%),

        radial-gradient(1px 1px at 48% 35%, rgba(200,220,255,0.5) 0%, transparent 100%),

        radial-gradient(1px 1px at 73% 55%, rgba(200,220,255,0.4) 0%, transparent 100%),

        radial-gradient(1px 1px at 18% 88%, rgba(255,255,255,0.5) 0%, transparent 100%),

        radial-gradient(1px 1px at 92% 12%, rgba(255,255,255,0.6) 0%, transparent 100%),

        radial-gradient(1.5px 1.5px at 63% 48%, rgba(255,255,255,0.3) 0%, transparent 100%);

    }

    #splash-screen {

      display: none;

    }

    .splash-wrapper {

      width: 100%; height: 100%; display: flex; flex-direction: column;

      align-items: center; justify-content: center;

      position: relative; overflow: hidden; padding: 0; gap: 0;

    }

    .grid-bg {

      position: absolute; inset: 0;

      background-image: linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);

      background-size: 60px 60px; animation: gridPulse 4s ease-in-out infinite;

    }

    @keyframes gridPulse { 0%,100%{opacity:0.4} 50%{opacity:0.9} }

    .math-symbol {

      position: absolute; font-family: 'Exo 2', sans-serif; color: var(--accent-color);

      opacity: 0; animation: floatSymbol 8s ease-in-out infinite; pointer-events: none; font-size: 1.5rem;

    }

    @keyframes floatSymbol {

      0%{opacity:0;transform:translateY(40px) rotate(0deg)} 20%{opacity:0.18} 80%{opacity:0.18}

      100%{opacity:0;transform:translateY(-200px) rotate(360deg)}

    }

    .title-line { overflow: hidden; position: relative; }

    .title-main {

      font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(1.8rem,5vw,3.5rem);

      color: var(--text-color); letter-spacing: 0.08em; text-transform: uppercase;

      opacity: 0; transform: translateY(100%);

      animation: slideReveal 1s cubic-bezier(0.16,1,0.3,1) 0.5s forwards;

      text-shadow: 0 0 20px rgba(0,212,255,0.4), 0 0 60px rgba(123,47,255,0.2); margin: 0;

    }

    .title-sub {

      font-family: 'Orbitron', sans-serif; font-weight: 400; font-size: clamp(1.2rem,3.5vw,2.5rem);

      color: var(--accent-color); letter-spacing: 0.35em; text-transform: uppercase;

      opacity: 0; transform: translateY(100%);

      animation: slideReveal 1s cubic-bezier(0.16,1,0.3,1) 1s forwards;

      text-shadow: 0 0 30px rgba(0,212,255,0.6), 0 0 80px rgba(0,212,255,0.3); margin: 0;

    }

    @keyframes slideReveal { 0%{opacity:0;transform:translateY(100%)} 100%{opacity:1;transform:translateY(0)} }

    .accent-line {

      width: 0; height: 2px;

      background: linear-gradient(90deg, transparent, var(--accent-color), var(--glow-color), var(--accent-color), transparent);

      animation: lineExpand 1.2s cubic-bezier(0.16,1,0.3,1) 1.5s forwards; margin: 0.2rem 0 0.4rem;

    }

    @keyframes lineExpand { 0%{width:0;opacity:0} 100%{width:min(80%,500px);opacity:1} }

    .video-container {

      position: relative; opacity: 0; transform: scale(0.8) translateY(30px);

      animation: imageReveal 1.2s cubic-bezier(0.16,1,0.3,1) 2s forwards;

      width: 550px; height: 550px; background: transparent;

    }

    .video-container video { display: block; width: 550px; height: 550px; object-fit: cover; }

    @keyframes imageReveal { 0%{opacity:0;transform:scale(0.8) translateY(30px)} 100%{opacity:1;transform:scale(1) translateY(0)} }

    .particle { position: absolute; width: 4px; height: 4px; border-radius: 50%; pointer-events: none; opacity: 0; }

    #games-screen {

      position: fixed; top: 0; left: 0; width: 100%; height: 100%;

      display: flex; flex-direction: column; align-items: center;

      padding: 20px; opacity: 1; overflow-y: auto; z-index: 999;

    }

    #games-screen > * { position: relative; z-index: 2; }

    header {

      position: relative; text-align: center; margin-bottom: 10px; width: 100%;

      background: var(--glass-bg); backdrop-filter: blur(18px) saturate(1.4);

      border: 1px solid var(--glass-border); border-radius: 20px; padding: 18px 24px 14px;

      box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.07);

    }

    header h1 {

      margin: 0; font-size: 42px; font-weight: 700; letter-spacing: 4px;

      background: linear-gradient(135deg,#00ffff,#4fc3ff,#ffd700,#00ffff); background-size: 300% 300%;

      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;

      animation: shimmerText 8s ease-in-out infinite;

      filter: drop-shadow(0 0 15px rgba(79,195,255,0.4)) drop-shadow(0 0 30px rgba(255,215,0,0.2));

    }

    @keyframes shimmerText { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

    #nav-tabs { margin-top: 14px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; width: 100%; }

    .nav-tab {

      padding: 10px 22px; border: 1px solid var(--glass-border); background: rgba(1,2,8,0.9);

      backdrop-filter: blur(12px); color: #8ab0d8; font-family: inherit; font-size: 13px;

      font-weight: 600; cursor: pointer; border-radius: 50px; transition: all 0.3s ease; letter-spacing: 1px;

      box-shadow: 0 2px 12px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.06);

    }

    .nav-tab:hover { border-color: rgba(79,195,255,0.6); background: rgba(15,25,55,0.5); color: #00ffff; }

    .nav-tab.active {

      border-color: rgba(79,195,255,0.7); background: rgba(10,20,45,0.6);

      color: #00ffff; box-shadow: 0 0 30px rgba(79,195,255,0.4), inset 0 1px 0 rgba(255,255,255,0.12);

    }

    #toolbar { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; justify-content: center; width: 100%; }

    .tool-btn {

      padding: 9px 20px; border: 1px solid var(--glass-border); background: rgba(1,2,8,0.9);

      backdrop-filter: blur(12px); color: #8ab0d8; font-family: inherit; font-size: 12px;

      font-weight: 600; cursor: pointer; border-radius: 50px; transition: all 0.3s ease; letter-spacing: 1px;

      box-shadow: var(--glass-shadow);

    }

    .tool-btn:hover { border-color: rgba(79,195,255,0.6); color: #00ffff; background: rgba(15,25,55,0.5); }

    .tool-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .tool-btn.danger { border-color: rgba(255,80,80,0.3); color: #ff8080; }

    .tool-btn.danger:hover { border-color: rgba(255,80,80,0.6); box-shadow: 0 0 20px rgba(255,80,80,0.2); background: rgba(2,5,16,0.5); }

    #progress-bar { width: 100%; height: 3px; background: rgba(79,195,255,0.1); border-radius: 2px; overflow: hidden; margin: 4px 0; }

    #progress-fill { height: 100%; background: linear-gradient(90deg,#00d4ff,#7b2fff); width: 0%; transition: width 0.3s ease; }

    #storage-info { font-family: 'Exo 2', sans-serif; font-size: 11px; letter-spacing: 1px; color: rgba(140,200,255,0.5); text-align: center; padding: 2px; }

    #count {

      position: fixed; top: 14px; right: 14px; font-size: 12px; color: #7dd8ff;

      background: var(--glass-bg); backdrop-filter: blur(14px); border: 1px solid var(--glass-border);

      padding: 6px 14px; border-radius: 50px; z-index: 1001; box-shadow: var(--glass-shadow); letter-spacing: 1px;

    }

    #search {

      margin: 8px auto; max-width: 440px; width: 100%; padding: 14px 20px; border-radius: 50px;

      border: 1px solid var(--glass-border); background: rgba(5,15,40,0.4); backdrop-filter: blur(16px);

      color: #e0f0ff; font-family: inherit; font-size: 14px; outline: none;

      box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.05); transition: all 0.3s ease; letter-spacing: 0.5px;

    }

    #search::placeholder { color: rgba(150,200,255,0.45); }

    #search:focus { border-color: rgba(79,195,255,0.5); background: rgba(5,20,55,0.55); }

    #games-wrapper { flex: 1; overflow-y: auto; width: 100%; }

    #games {

      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));

      justify-content: center; gap: 16px 8px; margin-top: 20px; padding: 0 10px 30px;

    }

    .game-wrap {

      display: flex; align-items: center; justify-content: center;

      width: 280px; height: 190px; position: relative;

      transition: transform 0.35s cubic-bezier(0.25,0.46,0.45,0.94), filter 0.35s ease;

      cursor: pointer;

    }

    .game-wrap:hover {

      transform: translateY(-10px) scale(1.07);

      filter: drop-shadow(0 0 22px rgba(0,212,255,0.65)) drop-shadow(0 0 50px rgba(123,47,255,0.4));

    }

    .planet-svg { width: 100%; height: 100%; overflow: visible; display: block; }

    .star-btn {

      position: absolute; top: 4px; right: 8px; width: 26px; height: 26px;

      border: 1px solid rgba(255,215,0,0.4); background: rgba(30,20,5,0.6);

      color: #ffd700; font-size: 13px; cursor: pointer; border-radius: 50%;

      display: flex; justify-content: center; align-items: center;

      transition: all 0.3s ease; z-index: 5; padding: 0; opacity: 0; pointer-events: all;

    }

    .download-btn {

      position: absolute; top: 4px; right: 40px; width: 26px; height: 26px;

      border: 1px solid rgba(100,200,100,0.4); background: rgba(10,30,10,0.6);

      color: #00ff88; font-size: 13px; cursor: pointer; border-radius: 50%;

      display: flex; justify-content: center; align-items: center;

      transition: all 0.3s ease; z-index: 5; padding: 0; opacity: 0; pointer-events: all;

    }

    .game-wrap:hover .star-btn { opacity: 1; }

    .game-wrap:hover .download-btn { opacity: 1; }

    .game-wrap:hover .cached-badge { opacity: 1; }

    .star-btn.favorited { opacity: 1; background: rgba(255,200,0,0.25); border-color: rgba(255,215,0,0.7); box-shadow: 0 0 16px rgba(255,215,0,0.5); }

    .download-btn.cached { opacity: 1; background: rgba(0,200,100,0.25); border-color: rgba(0,255,120,0.7); box-shadow: 0 0 16px rgba(0,255,120,0.5); }

    .download-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .cached-badge {

      position: absolute; top: 4px; right: 40px; width: 26px; height: 26px;

      background: rgba(0,200,100,0.25); border: 1px solid rgba(0,255,120,0.7);

      border-radius: 50%; display: flex; align-items: center; justify-content: center;

      font-size: 13px; color: #00ff88; pointer-events: none; z-index: 5;

      opacity: 0; transition: all 0.3s ease;

    }

    .cached-badge.visible { opacity: 1; }

    .game-wrap:hover .cached-badge { opacity: 1; }

    footer {

      text-align: center; font-size: 12px; letter-spacing: 2px; color: rgba(140,200,255,0.6);

      padding: 14px 30px; margin-top: 10px; width: 100%; max-width: 500px;

      background: var(--glass-bg); backdrop-filter: blur(14px);

      border: 1px solid var(--glass-border); border-radius: 50px; box-shadow: var(--glass-shadow);

    }

    #empty-state { text-align: center; margin-top: 60px; font-size: 18px; color: rgba(140,200,255,0.5); letter-spacing: 2px; }

    #soundboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 20px; padding: 0 10px 30px; }

    .sound-btn {

      padding: 16px 12px; border: 1px solid var(--glass-border); background: rgba(1,2,8,0.9);

      backdrop-filter: blur(12px); color: #00ffff; font-family: inherit; font-size: 13px;

      font-weight: 600; cursor: pointer; border-radius: 12px; transition: all 0.3s ease;

      box-shadow: var(--glass-shadow); text-transform: uppercase; letter-spacing: 1px;

      height: 80px; display: flex; align-items: center; justify-content: center; text-align: center;

      word-break: break-word; overflow: hidden;

    }

    .sound-btn:hover { border-color: rgba(79,195,255,0.6); background: rgba(15,25,55,0.5); box-shadow: 0 0 30px rgba(79,195,255,0.4); }

    .sound-btn:active { transform: scale(0.95); }

    .sound-btn.playing { background: rgba(0,212,255,0.25); border-color: rgba(0,212,255,0.7); box-shadow: 0 0 20px rgba(0,212,255,0.6); }

    #soundboard-empty { text-align: center; margin-top: 40px; font-size: 16px; color: rgba(140,200,255,0.5); letter-spacing: 2px; }

    ::-webkit-scrollbar { width: 6px; }

    ::-webkit-scrollbar-track { background: transparent; }

    ::-webkit-scrollbar-thumb { background: rgba(0,180,255,0.25); border-radius: 3px; }

  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/element_sdk.js" type="text/javascript"></script>
 </head>
 <body>
  <div class="nebula-bg"></div>
  <div class="stars"></div>
  <div id="count">
   Loading…
  </div>
  <div id="splash-screen">
   <div class="splash-wrapper">
    <div class="grid-bg"></div>
    <div id="mathSymbols"></div>
    <div id="particles"></div>
    <div style="text-align:center;position:relative;z-index:2;margin-bottom:-10px;margin-top:160px;">
     <div class="title-line">
      <h1 class="title-main">Math Helper</h1>
     </div>
     <div class="title-line">
      <p class="title-sub">Infinite</p>
     </div>
    </div>
    <div class="accent-line"></div>
    <div class="video-container">
     <video src="https://raw.githubusercontent.com/beastcooper/MHI_games/master/animation" autoplay muted loop playsinline></video>
    </div>
   </div>
  </div>
  <div id="games-screen">
   <header>
    <h1>🎵 MHI Soundboard 🎵</h1>
   </header>
   <div id="toolbar"><button class="tool-btn danger" onclick="stopAllSounds()">⏹️ Stop All</button>
   </div>
   <div id="games-wrapper">
    <div id="soundboard"></div>
    <div id="soundboard-empty" style="display:none;">
     Loading sounds…
    </div>
   </div>
   <footer>
    Ready to make some noise
   </footer>
  </div>
  <script>

    const OWNER = 'beastcooper', REPO = 'MHI_games', BRANCH = 'master';

    const SOUND_BASE = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/soundboard/`;

    const SOUND_API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/soundboard?ref=${BRANCH}`;

    const JSDELIVR_SOUND = `https://cdn.jsdelivr.net/gh/${OWNER}/${REPO}@${BRANCH}/soundboard/`;

    

    async function fetchWithFallback(primaryUrl, fallbackUrl) {

      try {

        const r = await fetch(primaryUrl, { signal: AbortSignal.timeout(15000) });

        if (r.ok) return r;

      } catch(e) {

        console.warn('Primary fetch failed, trying fallback:', e.message);

      }

      if (fallbackUrl) {

        try {

          const r = await fetch(fallbackUrl, { signal: AbortSignal.timeout(15000) });

          if (r.ok) return r;

        } catch(e) {

          console.warn('Fallback fetch also failed:', e.message);

        }

      }

      throw new Error('Unable to fetch from GitHub or fallback CDN');

    }



    let sounds = {}, playingSound = null;



    async function loadSounds() {

      try {

        const r = await fetchWithFallback(SOUND_API, SOUND_API);

        const items = await r.json();

        if (!Array.isArray(items)) return;

        for (const item of items) {

          if (item.type==='file' && /\.mp3$/i.test(item.name)) {

            const key = item.name.replace(/\.mp3$/i, '');

            const url = SOUND_BASE + item.name;

            const fallbackUrl = JSDELIVR_SOUND + item.name;

            sounds[key] = { url, fallbackUrl };

          }

        }

        updateCounter();

        renderSoundboard();

        cacheSounds();

      } catch(e) { 

        console.error('Failed to load sounds from API, trying manual list:', e);

        await loadSoundsManual();

      }

    }



    async function loadSoundsManual() {

      const soundList = ['air_horn', 'bell', 'buzzer', 'cash_register', 'cheer', 'clap', 'ding', 'error', 'notification', 'success', 'tada', 'whistle'];

      for (const name of soundList) {

        const url = SOUND_BASE + name + '.mp3';

        const fallbackUrl = JSDELIVR_SOUND + name + '.mp3';

        sounds[name] = { url, fallbackUrl };

      }

      updateCounter();

      renderSoundboard();

      cacheSounds();

    }



    async function cacheSounds() {

      const keys = Object.keys(sounds);

      for (let i = 0; i < keys.length; i++) {

        const key = keys[i];

        try {

          const r = await fetchWithFallback(sounds[key].url, sounds[key].fallbackUrl);

          const blob = await r.blob();

          sounds[key].cachedBlob = blob;

          sounds[key].objectUrl = URL.createObjectURL(blob);

        } catch(e) {

          console.warn(`Failed to cache sound ${key}:`, e);

        }

      }

    }



    function updateCounter() {

      const count = Object.keys(sounds).length;

      document.getElementById('count').textContent = `${count} sound${count !== 1 ? 's' : ''}`;

    }

    function renderSoundboard() {

      const container = document.getElementById('soundboard');

      const empty = document.getElementById('soundboard-empty');

      const keys = Object.keys(sounds);

      

      if (keys.length === 0) {

        empty.textContent = 'No sounds found';

        empty.style.display = 'block';

        return;

      }

      empty.style.display = 'none';

      container.innerHTML = '';

      

      keys.sort().forEach(key => {

        const btn = document.createElement('button');

        btn.className = 'sound-btn';

        btn.textContent = key;

        btn.onclick = () => playSound(key, btn);

        container.appendChild(btn);

      });

    }

    async function playSound(key, btn) {

      if (!sounds[key]) return;

      

      if (playingSound) {

        playingSound.audio.pause();

        playingSound.btn.classList.remove('playing');

      }

      

      try {

        const audio = new Audio();

        audio.src = sounds[key].objectUrl || URL.createObjectURL(sounds[key].cachedBlob);

        audio.play();

        

        btn.classList.add('playing');

        playingSound = { audio, btn };

        

        audio.onended = () => {

          btn.classList.remove('playing');

          if (playingSound.btn === btn) playingSound = null;

        };

      } catch(e) {

        console.error('Failed to play sound:', e);

      }

    }

    function stopAllSounds() {

      if (playingSound) {

        playingSound.audio.pause();

        playingSound.btn.classList.remove('playing');

        playingSound = null;

      }

    }

    document.addEventListener('keydown', (e) => {

      if (e.code === 'Space') {

        e.preventDefault();

        stopAllSounds();

      }

    });



    function initSplash() {

      const symbols = ['∑','∫','π','∞','√','Δ','∂','λ','θ','Ω','±','≈','≠','∝','∈'];

      const sc = document.getElementById('mathSymbols');

      for (let i = 0; i < 15; i++) {

        const s = document.createElement('span'); s.className = 'math-symbol';

        s.textContent = symbols[i % symbols.length];

        s.style.cssText = `left:${5+Math.random()*90}%;top:${60+Math.random()*40}%;animation-delay:${Math.random()*8}s;animation-duration:${6+Math.random()*6}s;font-size:${1+Math.random()*1.5}rem`;

        sc.appendChild(s);

      }

      const pc = document.getElementById('particles');

      ['#00d4ff','#7b2fff','#e0e8ff','#00ffaa'].forEach((col, ci) => {

        for (let i = ci; i < 30; i += 4) {

          const p = document.createElement('div'); p.className = 'particle';

          p.style.background = col; p.style.left = '50%'; p.style.top = '40%';

          const angle = (Math.PI*2*i)/30, dist = 80+Math.random()*200;

          const tx = Math.cos(angle)*dist, ty = Math.sin(angle)*dist, dur = 1+Math.random()*0.5;

          p.animate([

            {opacity:0,transform:'translate(-50%,-50%) scale(0)'},

            {opacity:1,transform:`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) scale(1)`,offset:0.3},

            {opacity:0,transform:`translate(calc(-50% + ${tx*1.5}px),calc(-50% + ${ty*1.5}px)) scale(0)`}
