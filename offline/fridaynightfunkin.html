<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Friday Night Funkin'</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

    body {
      background: #1a0a2e;
      color: #fff;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,80,180,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,80,180,0.07) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridScroll 8s linear infinite;
      z-index: 0;
    }

    @keyframes gridScroll {
      0% { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    h1 {
      font-size: 52px;
      letter-spacing: 4px;
      font-family: 'Fredoka One', 'Arial Black', sans-serif;
      font-weight: 900;
      color: #fff;
      text-shadow:
        0 0 20px rgba(255,80,180,0.8),
        0 0 60px rgba(255,80,180,0.4),
        4px 4px 0px #c8005a,
        8px 8px 0px #7a0038;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { text-shadow: 0 0 20px rgba(255,80,180,0.8), 0 0 60px rgba(255,80,180,0.4), 4px 4px 0px #c8005a, 8px 8px 0px #7a0038; }
      50% { text-shadow: 0 0 40px rgba(255,80,180,1), 0 0 100px rgba(255,80,180,0.6), 4px 4px 0px #c8005a, 8px 8px 0px #7a0038; }
    }

    .subtitle {
      font-size: 13px;
      color: rgba(255,180,230,0.7);
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    .arrows {
      display: flex;
      gap: 12px;
      margin: 8px 0;
    }

    .arrow {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      animation: arrowBounce 0.6s ease-in-out infinite alternate;
    }

    .arrow:nth-child(1) { background: #7b4fcf; color: #d9b8ff; animation-delay: 0s; }
    .arrow:nth-child(2) { background: #4a9fcf; color: #b8e4ff; animation-delay: 0.15s; }
    .arrow:nth-child(3) { background: #4fcf6e; color: #b8ffc8; animation-delay: 0.3s; }
    .arrow:nth-child(4) { background: #cf4f4f; color: #ffb8b8; animation-delay: 0.45s; }

    @keyframes arrowBounce {
      from { transform: translateY(0px); }
      to { transform: translateY(-8px); }
    }

    button {
      margin-top: 8px;
      padding: 16px 60px;
      font-size: 18px;
      font-family: 'Fredoka One', 'Arial Black', sans-serif;
      font-weight: bold;
      letter-spacing: 3px;
      background: transparent;
      color: #ff50b4;
      border: 2px solid #ff50b4;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
      box-shadow: 0 0 16px rgba(255,80,180,0.3), inset 0 0 16px rgba(255,80,180,0.05);
    }

    button:hover {
      background: rgba(255,80,180,0.15);
      box-shadow: 0 0 40px rgba(255,80,180,0.6), inset 0 0 20px rgba(255,80,180,0.1);
      transform: scale(1.03);
    }

    button:active { transform: scale(0.97); }

    #status {
      font-size: 12px;
      color: rgba(255,180,230,0.6);
      letter-spacing: 2px;
      min-height: 18px;
    }

    .note {
      font-size: 11px;
      color: rgba(255,180,230,0.35);
      letter-spacing: 1px;
      max-width: 340px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrap">
      <h1>FRIDAY NIGHT FUNKIN'</h1>
      <div class="subtitle">rhythm battle</div>
    </div>

    <div class="arrows">
      <div class="arrow">◄</div>
      <div class="arrow">▼</div>
      <div class="arrow">▲</div>
      <div class="arrow">►</div>
    </div>

    <button onclick="launchGame()">▶ LAUNCH GAME</button>
    <div id="status"></div>
    <div class="note">Requires internet connection to load game assets</div>
  </div>

  <script>
    const GAME_URL = 'https://w8.snokido.com/games/html5/friday-night-funkin/0281/index.html';

    async function launchGame() {
      const status = document.getElementById('status');
      status.textContent = 'LOADING...';

      try {
        const r = await fetch(GAME_URL);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        let html = await r.text();

        const BASE = 'https://w8.snokido.com/games/html5/friday-night-funkin/0281/';

        // Rewrite relative URLs so all assets load correctly
        html = html
          .replace(/(src|href)=(["'])(?!https?:|\/\/|data:|#)(.*?)\2/gi,
            (_, attr, q, path) => `${attr}=${q}${BASE}${path}${q}`)
          .replace(/url\((?!["']?(?:https?:|\/\/|data:))(["']?)(.*?)\1\)/gi,
            (_, q, path) => `url(${q}${BASE}${path}${q})`);

        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        status.textContent = 'BLOCKED OR UNAVAILABLE: ' + err.message;
      }
    }
  </script>
</body>
</html>
